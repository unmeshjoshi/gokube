# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com
version: 2
before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
builds:
  - id: apiserver
    main: cmd/apiserver/apiserver.go
    binary: apiserver
    env: &build_env
      - CGO_ENABLED=0
    goos: &build_goos
      - linux
      - darwin
    goarch: &build_goarch
      - arm64
      - amd64
  - id: controller
    binary: controller
    main: cmd/controller/controller.go
    env: *build_env
    goos: *build_goos
    goarch: *build_goarch
  - id: kubelet
    binary: kubelet
    main: cmd/kubelet/kubelet.go
    env: *build_env
    goos: *build_goos
    goarch: *build_goarch
  - id: scheduler
    binary: scheduler
    main: cmd/scheduler/scheduler.go
    env: *build_env
    goos: *build_goos
    goarch: *build_goarch
  - id: gokube
    binary: gokube
    main: cmd/gokube/gokube.go
    env: *build_env
    goos: *build_goos
    goarch: *build_goarch
archives:
  - formats: [ 'tar.gz' ]
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
    - goos: windows
      formats: [ 'zip' ]
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# The lines beneath this are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/use them.
